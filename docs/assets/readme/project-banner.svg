<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Darwin Knowledge Platform Backend Banner</title>
  <desc id="desc">README banner for a FastAPI backend integrated with OpenClaw, MySQL and MinIO.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .panel { fill: #ffffff; stroke: #d4dde3; stroke-width: 1.4; rx: 14; }
      .line { stroke: #49626f; stroke-width: 2; fill: none; }
      .dash { stroke-dasharray: 8 7; }
      .title { font: 700 42px Arial, "Microsoft YaHei", sans-serif; fill: #1c2f38; }
      .subtitle { font: 18px Arial, "Microsoft YaHei", sans-serif; fill: #49626f; }
      .label { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #253b44; }
      .small { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #526b76; }
      .chip { fill: #eef5f7; stroke: #c5d4db; stroke-width: 1; rx: 16; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="360"/>
  <rect class="panel" x="44" y="42" width="1192" height="276"/>
  <text class="title" x="92" y="120">Darwin Knowledge Platform Backend</text>
  <text class="subtitle" x="94" y="158">FastAPI 后端服务，连接 OpenClaw Agent、MySQL 数据库与 MinIO 私有对象存储</text>

  <rect class="chip" x="94" y="198" width="116" height="34"/>
  <text class="small" x="121" y="221">FastAPI</text>
  <rect class="chip" x="226" y="198" width="126" height="34"/>
  <text class="small" x="252" y="221">OpenClaw</text>
  <rect class="chip" x="368" y="198" width="96" height="34"/>
  <text class="small" x="394" y="221">MySQL</text>
  <rect class="chip" x="480" y="198" width="86" height="34"/>
  <text class="small" x="506" y="221">MinIO</text>
  <rect class="chip" x="582" y="198" width="128" height="34"/>
  <text class="small" x="607" y="221">SSE Chat</text>

  <rect class="panel" x="808" y="82" width="120" height="70"/>
  <text class="label" x="839" y="112">Web</text>
  <text class="small" x="831" y="135">前端</text>

  <rect class="panel" x="1000" y="82" width="140" height="70"/>
  <text class="label" x="1030" y="112">FastAPI</text>
  <text class="small" x="1020" y="135">API / Service</text>

  <rect class="panel" x="900" y="218" width="120" height="60"/>
  <text class="label" x="930" y="250">MySQL</text>
  <rect class="panel" x="1054" y="218" width="120" height="60"/>
  <text class="label" x="1088" y="250">MinIO</text>
  <rect class="panel" x="746" y="218" width="120" height="60"/>
  <text class="label" x="770" y="250">OpenClaw</text>

  <path class="line" d="M928 117 L1000 117"/>
  <path class="line" d="M1070 152 L960 218"/>
  <path class="line" d="M1070 152 L1114 218"/>
  <path class="line dash" d="M1000 152 L806 218"/>
</svg>

