<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">README system overview</title>
  <desc id="desc">High level architecture for Darwin Knowledge Platform Backend.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#35515d"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .group { fill: #f4f8fa; stroke: #c8d7df; stroke-width: 1.5; rx: 12; }
      .box { fill: #ffffff; stroke: #6f8995; stroke-width: 1.5; rx: 8; }
      .ext { fill: #f8fbf7; stroke: #82a38f; stroke-width: 1.5; rx: 8; }
      .title { font: 700 22px Arial, "Microsoft YaHei", sans-serif; fill: #1d3038; }
      .label { font: 700 16px Arial, "Microsoft YaHei", sans-serif; fill: #263c45; }
      .text { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #516a75; }
      .arrow { stroke: #35515d; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="560"/>
  <text class="title" x="44" y="46">Darwin Knowledge Platform Backend 系统架构概览</text>

  <rect class="box" x="48" y="222" width="150" height="86"/>
  <text class="label" x="84" y="258">Web 前端</text>
  <text class="text" x="75" y="282">HTTP / SSE</text>

  <rect class="group" x="270" y="86" width="420" height="380"/>
  <text class="label" x="421" y="122">FastAPI Backend</text>
  <rect class="box" x="310" y="154" width="155" height="62"/>
  <text class="label" x="363" y="181">API</text>
  <text class="text" x="327" y="201">endpoints / deps</text>
  <rect class="box" x="500" y="154" width="155" height="62"/>
  <text class="label" x="548" y="181">Schemas</text>
  <text class="text" x="526" y="201">Pydantic</text>
  <rect class="box" x="310" y="254" width="345" height="70"/>
  <text class="label" x="454" y="283">Service</text>
  <text class="text" x="346" y="306">Auth / Chat / Conversation / Attachment / Agent</text>
  <rect class="box" x="310" y="365" width="155" height="62"/>
  <text class="label" x="344" y="392">Repository</text>
  <text class="text" x="348" y="412">SQLAlchemy</text>
  <rect class="box" x="500" y="365" width="155" height="62"/>
  <text class="label" x="552" y="392">Model</text>
  <text class="text" x="527" y="412">ORM tables</text>

  <rect class="ext" x="800" y="96" width="300" height="84"/>
  <text class="label" x="875" y="128">OpenClaw Gateway</text>
  <text class="text" x="838" y="153">Agent Provision / Chat / Responses</text>

  <rect class="ext" x="800" y="246" width="300" height="84"/>
  <text class="label" x="927" y="278">MySQL</text>
  <text class="text" x="838" y="303">users / user_agents / conversations</text>

  <rect class="ext" x="800" y="396" width="300" height="84"/>
  <text class="label" x="932" y="428">MinIO</text>
  <text class="text" x="858" y="453">private chat attachments bucket</text>

  <path class="arrow" d="M198 265 L270 265"/>
  <path class="arrow" d="M465 185 L500 185"/>
  <path class="arrow" d="M482 216 L482 254"/>
  <path class="arrow" d="M482 324 L482 365"/>
  <path class="arrow" d="M690 289 L800 288"/>
  <path class="arrow" d="M655 266 C724 240, 738 156, 800 138"/>
  <path class="arrow" d="M655 310 C732 332, 735 430, 800 438"/>
  <path class="arrow dash" d="M800 438 C730 502, 515 503, 390 456"/>
</svg>

